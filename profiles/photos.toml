name = "캡처와 사진 나누기"

# EXIF 에 카메라 정보가 있으면 사진, 없으면 화면 캡처다.
# 파일명에 'screenshot' 이 없어도 정확히 갈린다.

# 영상이 먼저다. 사진·캡처를 가르는 기준(EXIF 카메라 정보)은 이미지에만 있어서
# 영상은 어느 쪽에도 안 걸리고 그대로 남는다. 실측으로 확인했다.
[[rules]]
to = "영상"
ext = [".mp4", ".mov", ".avi", ".mkv", ".webm", ".m4v", ".wmv", ".mpg", ".mpeg"]

[[rules]]
to = "사진"
has_exif_camera = true

[[rules]]
to = "캡처"
has_exif_camera = false
